# For a "Ideas & feedback" category (format: Open-ended discussion).
title: '[Idea] '
labels: ['feedback']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make animepoodle better! Bugs are welcome here too. Just tell us what happened and what you expected.
  - type: dropdown
    id: kind
    attributes:
      label: What's this about?
      options:
        - A new idea
        - Something felt off
        - A bug
        - Wrong or missing data
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: For bugs, include the page link, your browser and phone or computer, and the steps.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page link (optional)
      placeholder: https://animepoodle.mavern.in/browse?kind=MOVIE
